<!DOCTYPE html>
<html>
<head>
  <title>PAYMENT METHOD</title>
  <link rel="stylesheet" href="Payment.css">
</head>

<body>
  <div class="header">
    ← <span>PAYMENT METHOD</span>
  </div>

  <div class="container">
    <h3>Select Payment Method</h3>

    <div class="PM">
      <label>
        <img src="https://img.icons8.com/ios-filled/50/000000/qr-code.png" alt="QR">
        QR
      </label>
      <input type="radio" name="payment">
    </div>

    <div class="PM">
      <label for="Payment">
        <img src="https://img.icons8.com/ios-filled/50/000000/wallet--v1.png" alt="E Wallet">
        Payment Center/ E Wallet
      </label>
	  <span>▼</span>
    </div>

    <div class="PM">
      <label>
        <img src="https://img.icons8.com/ios-filled/50/000000/bank-building.png" alt="Bank">
        Bank Transfer
      </label>
      <input type="radio" name="payment">
    </div>

    <div class="PM">
      <label>
        <img src="https://img.icons8.com/ios-filled/50/000000/bank-cards.png" alt="Cards">
        Cards
      </label>
      <span>▼</span>
    </div>
  </div>
  <div>
	<button type="submit">Confirm</button>
	</div>
  <script src="main.js"></script>
</body>
</html>
